# pnpm refuses to read this file without a `packages` key, and an empty list would
# declare a workspace holding no packages, leaving changesets unable to resolve the
# package any changeset names. The root package is the published one, so list it.
packages:
  - "."
allowBuilds:
  esbuild: true
  # wrangler pulls workerd, and `wrangler-action` installs wrangler into the project
  # to deploy the demo, so an unapproved build script there stops the deploy: pnpm 11
  # fails the install with ERR_PNPM_IGNORED_BUILDS rather than warning as pnpm 10 did.
  # A Pages upload never runs the runtime binary this builds; it is approved so that
  # installing wrangler succeeds.
  workerd: true
# pnpm 11 renamed `allowBuilds` from `onlyBuiltDependencies` and ignores the old key
# without warning. Both are kept so the build runs on pnpm 9, 10 and 11 alike.
onlyBuiltDependencies:
  - esbuild
  - workerd
overrides:
  # magic-string 1.4.3 makes @unocss/transformer-directives write the declarations it
  # inserts a second time into the wrong place, which leaves loose declarations in
  # Slidev's bundled CSS and fails `slidev build` in the lightningcss minifier
  # (unocss/unocss#5373). Hold it at 1.4.2 until a fixed release is out.
  magic-string@^1.4.3: 1.4.2
# Slidev 53 pulls in several long-published releases (chokidar 4.0.3, undici-types
# 6.21.0, ...) that lack the provenance attestation an earlier version carried.
# pnpm's trust policy rejects those as possible takeovers. A takeover is caught
# while it is fresh, so the check is skipped only for releases older than 30 days.
trustPolicyIgnoreAfter: 43200
